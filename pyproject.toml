[project]
name = "ha-parmair"
version = "0.6.3"
requires-python = "==3.14.10"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.11.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.17.5",
  "pymodbus==3.13.1",
  "modbus-connection[tmodbus]==4.12.7",
  "tmodbus==1.1.0",
]

[tool.uv]
package = false
# Python 3.14.10 is the exact dev/test interpreter. HACS runtime minimum
# stays in hacs.json.
# Plugin 0.13.375 pins HA 2026.10.4; override only its dev dependency
# to test against HA 2026.11.1.
override-dependencies = ["homeassistant==2026.11.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:homeassistant -p no:respx"
asyncio_mode = "auto"
# Pure tests (test_registers/test_capabilities/test_summer_auto) load their
# module via importlib and need only pytest; test_modbus additionally uses
# modbus_connection's own mock. The HA-side tests under tests/ha/ use
# pytest-homeassistant-custom-component against HA 2026.11.1 / Python 3.14.10.

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "B008",   # function calls in argument defaults (HA selector pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.parmair"]
